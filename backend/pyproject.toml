[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kdafik-racing-manager-backend"
version = "0.1.0"
description = "FastAPI backend MVP for Kdafik Racing Manager."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.8,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.76,<0.3.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "numpy>=2.0,<3.0",
    "opencv-contrib-python>=4.10,<5.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "tools"]
exclude = [
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "pytest-cache-files-*",
    "venv",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
