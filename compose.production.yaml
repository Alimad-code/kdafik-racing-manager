services:
  web:
    profiles: !override [production]
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    env_file:
      - ./deploy/.env.${APP_ENVIRONMENT:?Set APP_ENVIRONMENT to local or production}
    depends_on:
      backend:
        condition: service_healthy
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes: !override
      - ./deploy/tls/${APP_ENVIRONMENT:?Set APP_ENVIRONMENT to local or production}:/run/tls:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/internal-health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
